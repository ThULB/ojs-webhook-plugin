# Runs the plugin's PHPUnit test suite (currently: WebhookUrlValidator, which
# has no OJS/PKP dependency and therefore needs no OJS bootstrap) on every
# push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit